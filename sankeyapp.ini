[uwsgi]
module = wsgi:application

master = true
processes = 2
threads = 2
enable-threads = true

socket = sankeyapp.sock
chmod-socket = 660
# Force le groupe du socket a www-data pour que nginx puisse s'y connecter.
# Sur dev, le dossier de deploiement est setgid+groupe `deploy` (double canal
# ubuntu/gitlab-runner) : sans ce chown-socket, le socket herite du groupe
# `deploy` (nginx www-data exclu) -> 502 a chaque redeploiement. Inoffensif sur
# prod/test ou le socket finit deja en www-data via l'egid du process.
chown-socket = ubuntu:www-data
vacuum = true
env = PYTHONUNBUFFERED=1
die-on-term = true

http-to = sankeyapp.sock
