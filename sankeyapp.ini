[uwsgi]
module = wsgi:application

master = true
processes = 2
threads = 2
enable-threads = true

# #255 — Chemin du socket. Il DOIT vivre HORS des slots de deploiement : sinon il
# suivrait le dossier de travail (qui change a chaque release) et nginx devrait
# etre reconfigure a chaque fois. Le chemin stable est fourni par UWSGI_SOCKET
# (pose dans le fichier `env` par bootstrap_release_layout.sh).
#
# Repli sur l'ancien chemin relatif tant qu'un environnement n'a pas ete migre :
# `if-env` n'active son bloc que si la variable existe, donc un seul `socket` est
# retenu dans les deux cas.
if-env = UWSGI_SOCKET
socket = %(_)
endif =
if-not-env = UWSGI_SOCKET
socket = sankeyapp.sock
endif =
chmod-socket = 660
# Force le groupe du socket a www-data pour que nginx puisse s'y connecter.
# Sur dev, le dossier de deploiement est setgid+groupe `deploy` (double canal
# ubuntu/gitlab-runner) : sans ce chown-socket, le socket herite du groupe
# `deploy` (nginx www-data exclu) -> 502 a chaque redeploiement. Inoffensif sur
# prod/test ou le socket finit deja en www-data via l'egid du process.
chown-socket = ubuntu:www-data
vacuum = true
env = PYTHONUNBUFFERED=1
die-on-term = true

if-env = UWSGI_SOCKET
http-to = %(_)
endif =
if-not-env = UWSGI_SOCKET
http-to = sankeyapp.sock
endif =
