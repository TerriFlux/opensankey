stages:
    - build
    - test
    - deploy
    - build-docker

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  GITLAB_RUNNER_ENV: /home/gitlab-runner/gitlab_test
  TAG_TEST: test
  TAG_PROD: prod # or v1.1
  # Variables Docker
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE/sankeyapp:$CI_COMMIT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE/sankeyapp:latest
  DOCKER_DRIVER: overlay2

# Cache
cache:
  paths:
    - .cache/pip
    - node_modules/
    - .npm/

# ========================================
# BUILD DOCKER IMAGE
# ========================================

# ===========================
# Étape 1 : Build & Push Docker
# ===========================

build-sankeysuite-docker:
  stage: build-docker
  tags:
    - dev
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "🔧 Build image from Dockerfile"
    - docker build -t "$DOCKER_IMAGE" -t "$DOCKER_IMAGE_LATEST" -f Dockerfile .
    - echo "📤 Push image to GitLab registry"
    - docker push "$DOCKER_IMAGE"
    - docker push "$DOCKER_IMAGE_LATEST"
  rules:
    - changes:
        - Dockerfile
        - client/package.json
        - build_client.sh
        - submodules/**/*
    - if: '$CI_COMMIT_REF_NAME == "main"'
      when: manual
    - if: '$BUILD_DOCKER_IMAGE == "true"'
  allow_failure: false

# Build : for all branches, units tests for submodules server side
build:
  stage: build
  tags:
    - dev
  script:
    # Specify env
    - echo $CI_PROJECT_DIR
    - source /home/gitlab-runner/gitlab_dev/bin/activate
    - export EIGEN_INCLUDE=$CI_PROJECT_DIR/submodules/MFAProblem/submodules/eigen
    # Build SankeySuite node module
    - bash build_client.sh -I -L -B -D -S
    # Check flask server
    - bash build_server.sh
  artifacts:
    paths:
      - sankeyapplication/client/build  # c'est le dossier généré par `npm run build`
  except:
    - schedules


# # Test : for all branches, units tests for submodules server side
test:
  stage: test
  tags:
    - dev, test
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  variables:
    TESTS_DIR: /home/ubuntu/dev_opensankey/sankeysuitemanager/Tests
  script:
    - echo $CI_PROJECT_DIR
    - echo $TESTS_DIR
    - echo $GITLAB_RUNNER_ENV/bin/activate
    - source $GITLAB_RUNNER_ENV/bin/activate
    - echo "No test" # TODO add some tests
  dependencies:
    - build

# Deploy : Only for main, on dev url acces
dev_opensankey:
  stage: deploy
  variables:
    NODE_ENV: "production"
    ROOT_FOLDER: /home/ubuntu/dev_opensankey
    REPO_FOLDER: $ROOT_FOLDER/sankeyapplication
    ENV: dev
    APP_NAME: dev_sankeyapp
  only:
    - main
  tags:
    - dev
  environment:
    name: dev
  script:
    # DBG
    - echo $REPO_FOLDER
    # Clean and pull repo
    - git config --global --add safe.directory $REPO_FOLDER
    - cd $REPO_FOLDER
    - git reset --hard
    - git clean -fdx -e env -e server/db.sqlite -e server/db.sqlite.bk -e server/__pycache__ -e doc/__pycache__ -e __pycache__
    - git fetch
    - git pull
    - git config --global --add safe.directory /home/ubuntu/dev_opensankey/sankeyapplication/submodules/LoginComponent
    - git config --global --add safe.directory /home/ubuntu/dev_opensankey/sankeyapplication/submodules/MFAProblem
    - git config --global --add safe.directory /home/ubuntu/dev_opensankey/sankeyapplication/submodules/MFAProblem/submodules/eigen
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+/submodules/OpenSankey
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser
    - git submodule init
    - git submodule foreach --recursive git reset --hard
    - git submodule foreach --recursive git clean -fdx
    - git submodule update --recursive
    # Build client & server
    - source $ROOT_FOLDER/dev_opensankey/bin/activate
    - export EIGEN_INCLUDE=$CI_PROJECT_DIR/submodules/MFAProblem/submodules/eigen
    - bash deploy_SankeyApp.sh
    # Update db
    - cp server/db.sqlite server/db.sqlite.bk/db_`date --iso-8601='seconds'`.sqlite
    - find ./server/db.sqlite.bk -mtime +30 -type f -delete
    - alembic upgrade head
    # Start app
    - bash restart_site.sh $ENV

