# Build : for all branches, units tests for submodules server side
build:
  stage: build
  tags: [py312]
  script:
    # Specify env
    - echo $CI_PROJECT_DIR
    - source /home/gitlab-runner/gitlab_dev/bin/activate
    - export EIGEN_INCLUDE=$CI_PROJECT_DIR/submodules/MFAProblem/submodules/eigen
    # Build SankeySuite node module
    - bash scripts/build_client.sh -I -L -B -D # -S
    # Check flask server
    - bash scripts/build_server.sh
  artifacts:
    paths:
      - client/build  # c'est le dossier généré par `npm run build`
  except:
    - schedules


# # Test : for all branches, units tests for submodules server side
test:
  stage: test
  tags: [py312]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  script:
    - echo $CI_PROJECT_DIR
    - source /home/gitlab-runner/gitlab_dev/bin/activate
    - export EIGEN_INCLUDE=$CI_PROJECT_DIR/submodules/MFAProblem/submodules/eigen
    - export TESTS_DIR=$CI_PROJECT_DIR/SankeyData/tests
    # Force-reinstall SEP and MFAProblem from the SA-pinned submodule paths so the
    # shared runner venv reflects this pipeline's pins (otherwise a previous job on
    # the runner can leave a stale install and tests run against the wrong code).
    - rm -f $VIRTUAL_ENV/lib/python*/site-packages/MFAProblem.egg-link
    - sed -i '/mfa_problem/d' $VIRTUAL_ENV/lib/python*/site-packages/easy-install.pth || true
    - pip install -e submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser
    - pip install -e submodules/MFAProblem
    # Run pytest separately per submodule so each has its own rootdir/sys.path.
    # Avoids "tests" package name collisions between sibling submodules and lets
    # mfa_problem resolve to the local source (which contains the tests/ subpackage).
    - (cd submodules/MFAProblem && python -m pytest tests/)
    - (cd submodules/OpenSankey+/submodules/OpenSankey && python -m pytest opensankey/tests/)
    - (cd submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser && python -m pytest tests/)
  dependencies:
    - build

# Deploy : Only for main, on dev url acces
dev_opensankey:
  stage: deploy
  variables:
    NODE_ENV: "production"
    ROOT_FOLDER: /home/ubuntu/dev_opensankey
    REPO_FOLDER: $ROOT_FOLDER/sankeyapplication
    ENV: dev
    APP_NAME: dev_sankeyapp
  tags: [py312]
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
      when: manual
      allow_failure: true
  needs:
    - build
    - job: test
      optional: true
  dependencies:
    - build
  script:
    # DBG
    - echo $REPO_FOLDER
    # Clean and pull repo
    - git config --global --add safe.directory $REPO_FOLDER
    - cd $REPO_FOLDER
    # Shared-deploy umask : artefacts group-writable pour que gitlab-runner et
    # l'utilisateur ubuntu (update_opensankey.sh) puissent s'ecraser mutuellement.
    - umask 002
    - rm -f .git/index.lock || true
    - git reset --hard
    - git clean -fdx -e env -e cache -e server/db.sqlite -e server/db.sqlite.bk -e server/__pycache__ -e doc/__pycache__ -e __pycache__
    - git fetch
    - git pull
    - git config --global --add safe.directory $REPO_FOLDER/sankeyapplication/submodules/LoginComponent
    - git config --global --add safe.directory $REPO_FOLDER/sankeyapplication/submodules/MFAProblem
    - git config --global --add safe.directory $REPO_FOLDER/sankeyapplication/submodules/MFAProblem/submodules/eigen
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+/submodules/OpenSankey
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser
    - git config --global --add safe.directory $REPO_FOLDER/SankeyData
    - git submodule init
    - git submodule foreach --recursive git reset --hard
    - git submodule foreach --recursive git clean -fdx
    - git submodule update --recursive
    # Build client & server
    - source $ROOT_FOLDER/dev_opensankey/bin/activate
    - export EIGEN_INCLUDE=$CI_PROJECT_DIR/submodules/MFAProblem/submodules/eigen
    - bash scripts/deploy_SankeyApp.sh
    # Update db
    - cp server/db.sqlite server/db.sqlite.bk/db_`date --iso-8601='seconds'`.sqlite
    - find ./server/db.sqlite.bk -mtime +30 -type f -delete
    - alembic upgrade head
    # Start app
    - bash scripts/restart_site.sh $ENV

test_opensankey:
  stage: deploy
  variables:
    NODE_ENV: "production"
    ROOT_FOLDER: /home/ubuntu/test_opensankey
    REPO_FOLDER: $ROOT_FOLDER/sankeyapplication
    ENV: test
    APP_NAME: test_sankeyapp
  tags:
    - py312
  environment:
    name: test
  before_script:
    # Configurer safe.directory AVANT que les submodules soient clonés
    - git config --global safe.directory '*'
    # Shared-deploy umask : artefacts group-writable (cf. dev_opensankey).
    - umask 002
  rules:
    - if: $CI_COMMIT_REF_NAME == $TAG_TEST
  needs:
    - build
    - job: test
      optional: true
  dependencies:
    - build
  script:
    # DBG
    - echo $REPO_FOLDER
    # Clean and pull repo
    - cd $REPO_FOLDER
    - git reset --hard
    - git clean -fdx -e env -e cache -e server/db.sqlite -e server/db.sqlite.bk -e server/__pycache__ -e doc/__pycache__ -e __pycache__
    - git fetch
    - git pull
    - git submodule init
    - git submodule foreach --recursive git reset --hard
    - git submodule foreach --recursive git clean -fdx
    - git submodule update --recursive
    # Build client & server
    - source $ROOT_FOLDER/test_opensankey/bin/activate
    - bash scripts/deploy_SankeyApp.sh
    # Update db
    - cp server/db.sqlite server/db.sqlite.bk/db_`date --iso-8601='seconds'`.sqlite
    - find ./server/db.sqlite.bk -mtime +180 -type f -delete
    - alembic upgrade head
    # Start app
    - bash scripts/restart_site.sh $ENV

prod_opensankey:
  stage: deploy
  variables:
    NODE_ENV: "production"
    ROOT_FOLDER: /home/ubuntu/prod_opensankey
    REPO_FOLDER: $ROOT_FOLDER/sankeyapplication
    ENV: prod
    APP_NAME : prod_sankeyapp
  tags:
    - py312
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_REF_NAME == $TAG_PROD
  needs:
    - build
    - job: test
      optional: true
  dependencies:
    - build
  script:
    # DBG
    - echo $REPO_FOLDER
    # Clean and pull repo
    - git config --global --add safe.directory $REPO_FOLDER
    - cd $REPO_FOLDER
    - git reset --hard
    - git clean -fdx -e env -e cache -e server/db.sqlite -e server/db.sqlite.bk -e server/__pycache__ -e doc/__pycache__ -e __pycache__
    - git fetch
    - git pull
    # Shared-deploy umask : artefacts group-writable (cf. dev_opensankey).
    - umask 002
    - git config --global --add safe.directory /home/ubuntu/prod_opensankey/sankeyapplication/submodules/MFAProblem
    - git config --global --add safe.directory $REPO_FOLDER/sankeyapplication/submodules/LoginComponent
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+/submodules/OpenSankey
    - git config --global --add safe.directory $REPO_FOLDER/submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser
    - git config --global --add safe.directory $REPO_FOLDER/SankeyData
    - git submodule init
    - git submodule foreach --recursive git reset --hard
    - git submodule foreach --recursive git clean -fdx
    - git submodule update --recursive
    # Build client & server
    - source $ROOT_FOLDER/prod_opensankey/bin/activate
    - bash scripts/deploy_SankeyApp.sh
    # Update db
    - cp server/db.sqlite server/db.sqlite.bk/db_`date --iso-8601='seconds'`.sqlite
    - find ./server/db.sqlite.bk -mtime +365 -type f -delete
    - alembic upgrade head
    # Start app
    - bash scripts/restart_site.sh $ENV

# =====================================================================
# build:examples — Builde la lib SA (npm run dist) + les examples React
#                  (examples/current/{viewer,editor}). Les artifacts sont
#                  consommes par les jobs `pages:` et `publish:npm`.
# Ce job est independant du job `build:` (qui produit client/build pour
# le SaaS) et ne necessite pas de python ni de submodules natifs.
# =====================================================================
build:examples:
  stage: build
  tags: [py312]
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
  script:
    # build_client.sh -I -D : install pnpm deps + recree les symlinks
    # client/src/deps/{OpenSankey+,LoginComponent} (sans quoi tsc echoue
    # avec TS2307 sur tous les imports './deps/...') + lance pnpm run dist.
    - echo "[INFO] Install + symlinks + dist de la lib SA"
    - bash scripts/build_client.sh -I -D
    # TEMP (1.1.6) — build des exemples React entièrement skippé. `current/editor`
    # utilise l'ancienne API SpreadSheet (reactgrid), remplacée par le tableur
    # Univer : il ne compile plus et doit être réécrit. `current/viewer` tombe par
    # ailleurs en OOM (heap Node). Ce job ne produit plus que `client/dist`, le seul
    # artefact dont dépend publish:npm. À restaurer après refonte des exemples 1.1.x.
    # - echo "[INFO] Build des examples React (current uniquement)"
    # - cd examples
    # - bash build-all.sh --only current
  artifacts:
    paths:
      - client/dist
    expire_in: 1 week

# =====================================================================
# publish:python — Publie MFAProblem et SankeyExcelParser sur le GitLab
#                  PyPI Package Registry du projet (accessible ensuite au
#                  niveau groupe via /groups/su-model/-/packages/pypi/).
#                  Auth via CI_JOB_TOKEN (intégré GitLab).
# Déclenche uniquement sur tag git (CI_COMMIT_TAG), symétrique à publish:npm.
#
# Côté consommateur (ex: cartofob-sankey), ajouter dans requirements.txt :
#   --extra-index-url https://__token__:<DEPLOY_TOKEN>@gitlab.com/api/v4/groups/su-model/-/packages/pypi/simple/
#   MFAProblem>=1.1.4
#   SankeyExcelParser>=1.1.4
# =====================================================================
publish:python:
  stage: deploy
  tags: [py312]
  rules:
    - if: $CI_COMMIT_TAG
  # npm d'abord : publish:python attend publish:npm (chaîne build:examples ->
  # publish:npm -> publish:python). En prime, npm s'exécute donc AVANT que les
  # builds de wheels (docker root) ne créent des fichiers root dans le workspace,
  # donc plus aucun risque que le git submodule update de npm échoue (cf. chown ci-dessous).
  needs:
    - publish:npm
  dependencies: []
  script:
    # Version alignee sur le tag git (et donc sur la version npm publiee
    # simultanement par publish:npm). Lue par chaque setup.py via
    # os.environ.get("PKG_VERSION", "<fallback>").
    - export PKG_VERSION="${CI_COMMIT_TAG#v}"
    - echo "[publish:python] PKG_VERSION=${PKG_VERSION}"

    # ----------------------------------------------------------------
    # MFAProblem — build_wheel_linux.sh gère tout (manylinux + auditwheel)
    # Sans argument le script boucle sur cp310 et cp312, produisant deux
    # wheels dans dist/. pip choisit automatiquement la bonne selon le
    # Python de l'environnement cible.
    # ----------------------------------------------------------------
    - echo "[publish:python] Build MFAProblem wheels (manylinux, cp310 + cp312)"
    - bash submodules/MFAProblem/build_wheel_linux.sh cp310-cp310 cp312-cp312

    # ----------------------------------------------------------------
    # SankeyExcelParser — même recette manylinux pour cohérence
    # ----------------------------------------------------------------
    - echo "[publish:python] Build SankeyExcelParser wheels (manylinux, cp310 + cp312)"
    - bash submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser/build_wheel_linux.sh cp310-cp310 cp312-cp312

    # ----------------------------------------------------------------
    # Ceinture-bretelles : les wheel builds tournent en root dans le
    # container manylinux et laissent build/, dist/, *.egg-info,
    # */tests/, */data/ owned by root. On normalise l'ownership pour ne pas
    # laisser de fichiers root dans le workspace partagé du runner (sinon un
    # job ultérieur — ex. pages, ou un re-run — echoue au 'git submodule
    # update' avec "Permission denied"). publish:npm tourne desormais AVANT ce
    # job, donc il n'est plus concerné ; on garde ce filet pour les autres jobs.
    # Les scripts build_wheel_linux.sh font deja un trap chown EXIT cote
    # container, mais on garde ce filet ici pour couvrir les vieux SHA sans le fix.
    - echo "[publish:python] Normalise l'ownership host sur tous les artefacts"
    - |
      docker run --rm -v "$(pwd):/io" --entrypoint sh quay.io/pypa/manylinux2014_x86_64 \
        -c "chown -R $(id -u):$(id -g) /io"

    # ----------------------------------------------------------------
    # Republication : la registry PyPI GitLab refuse d'ecraser un fichier
    # deja publie (HTTP 400 Bad Request). Un re-tag reutilise le meme
    # numero de version (ex: republication de v1.1.4 sur un nouveau
    # commit), donc on supprime d'abord les packages PyPI de cette version
    # avant de reuploader les wheels reconstruites.
    # Token : GITLAB_PACKAGES_TOKEN (PAT/Project token, scope api) en
    # priorite ; sinon CI_JOB_TOKEN — qui peut manquer du droit de
    # suppression selon la version GitLab : definir la variable CI dans ce
    # cas (le job echouera proprement avec un HTTP 401/403 sinon).
    # ----------------------------------------------------------------
    - echo "[publish:python] Supprime les packages PyPI ${PKG_VERSION} deja publies (republication)"
    - python3 scripts/gitlab_delete_pypi_version.py "${PKG_VERSION}"

    # ----------------------------------------------------------------
    # Publication sur le GitLab PyPI Registry du projet
    # Les wheels sont accessibles au niveau groupe :
    #   /groups/su-model/-/packages/pypi/simple/
    # ----------------------------------------------------------------
    - echo "[publish:python] Upload vers GitLab PyPI Registry"
    # --break-system-packages : le python systeme du VPS (Debian 12, PEP 668)
    # refuse les installs pip directs. On accepte ici puisque le runner est
    # ephemere pour ce job (pas de risque de pollution durable).
    # twine>=6 + packaging>=24 nécessaires pour reconnaître le champ
    # 'License-File' (PEP 639) émis par setuptools>=77 dans les METADATA
    # des wheels — sinon InvalidDistribution à l'upload.
    - pip install --upgrade --quiet --break-system-packages 'twine>=6' 'packaging>=24'
    - |
      TWINE_USERNAME=gitlab-ci-token \
      TWINE_PASSWORD=${CI_JOB_TOKEN} \
      python3 -m twine upload \
        --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
        submodules/MFAProblem/dist/*manylinux*.whl \
        submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser/dist/*manylinux*.whl

# =====================================================================
# publish:npm — Publie @terriflux/sankeyapplication sur le GitLab Package
#               Registry du projet. Auth via CI_JOB_TOKEN (intégré GitLab).
# Déclenche uniquement sur tag git (CI_COMMIT_TAG).
# =====================================================================
publish:npm:
  stage: deploy
  tags: [py312]
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:examples
  dependencies:
    - build:examples
  script:
    - cd client
    # GitLab Package Registry exige l'ID numerique du projet pour npm publish
    # (le path encoded fonctionne en read mais pas en publish). On declare
    # le scope @terriflux uniquement ici (pas de publishConfig dans
    # package.json) pour que les deux URLs soient trivialement identiques.
    - |
      cat > .npmrc <<EOF
      @terriflux:registry=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/
      //gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}
      EOF
    # Idempotent : skip si la version est déjà sur le registry (cas typique
    # d'un retag ou d'un re-trigger du pipeline). Sinon le job échoue avec
    # "Package already exists" et pollue la liste des paquets en erreur.
    - |
      PKG_NAME="$(node -p "require('./package.json').name")"
      PKG_VERSION="$(node -p "require('./package.json').version")"
      if npm view "${PKG_NAME}@${PKG_VERSION}" version >/dev/null 2>&1; then
        echo "[publish:npm] ${PKG_NAME}@${PKG_VERSION} déjà publié — skip"
      else
        npm publish
      fi

# Étape de build
pages:
  tags: [py312]
  stage: deploy
  variables:
    GIT_SUBMODULE_STRATEGY: none  # Pas de sous-modules du tout
    PAGES_BASE_URL: "${CI_PAGES_URL}"
  needs:
    - build
    - job: test
      optional: true
    - build:examples
  dependencies:
    - build
    - build:examples
  rules:
    - when: manual
      allow_failure: true
  script:
    # === Outils ===
    # Le runner SA est un shell runner (pas docker), donc wget/zip sont deja
    # presents sur la machine — pas d'apt-get a faire.
    # === Configuration des variables d'environnement pour React ===
    - echo "[INFO] Configuration des variables d'environnement pour le mode GitLab Pages"

    # === Récupération de la version depuis package.json ===
    - PACKAGE_JSON_PATH="$CI_PROJECT_DIR/client/package.json"
    - |
      if [ ! -f "$PACKAGE_JSON_PATH" ]; then
        echo "[ERREUR] Le fichier package.json est introuvable à : $PACKAGE_JSON_PATH"
        exit 1
      fi
    - APP_VERSION=$(node -p "require('$PACKAGE_JSON_PATH').version")
    - |
      if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "undefined" ]; then
        echo "[ERREUR] Impossible de lire la version depuis package.json"
        exit 1
      fi
    - echo "[INFO] Version détectée depuis package.json  $APP_VERSION"

    # === Chemins ===
    - JS_DIR="$CI_PROJECT_DIR/client/build/static/js"
    - CSS_DIR="$CI_PROJECT_DIR/client/build/static/css"
    - INDEX_FILE="$CI_PROJECT_DIR/client/build/index.html"
    - BUILD_DIR="$CI_PROJECT_DIR/client/build"
    - PUBLIC_DIR="$CI_PROJECT_DIR/public"
    - mkdir -p "$PUBLIC_DIR"
    - VERSION_DIR="$PUBLIC_DIR/$APP_VERSION"
    - LATEST_DIR="$PUBLIC_DIR/latest"

    # === Configuration des variables d'environnement React ===
    - echo "REACT_APP_DEPLOYMENT_TYPE=gitlab-pages" > "$BUILD_DIR/.env.production"
    - echo "REACT_APP_IS_DEMO_MODE=true" >> "$BUILD_DIR/.env.production"
    - echo "REACT_APP_HAS_SERVER_ACCESS=false" >> "$BUILD_DIR/.env.production"
    - echo "REACT_APP_VERSION=$APP_VERSION" >> "$BUILD_DIR/.env.production"
    - echo "[INFO] Variables d'environnement configurées pour React"

    # === JS ===
    - |
      cd "$JS_DIR"
      for f in main.*.js; do
        cp "$f" "sankeyapplication-v$APP_VERSION.js"
        echo "[INFO] JS renommé : $f → sankeyapplication-v$APP_VERSION.js"
        sed -i "s|$f|sankeyapplication-v$APP_VERSION.js|g" "$INDEX_FILE"
        rm "$f"
        echo "[INFO] Fichier original supprimé : $f"
      done
      # Traitement des fichiers .js.map
      for f in main.*.js.map; do
        if [ -f "$f" ]; then
          cp "$f" "sankeyapplication-v$APP_VERSION.js.map"
          echo "[INFO] JS.MAP renommé : $f → sankeyapplication-v$APP_VERSION.js.map"
          sed -i "s|$f|sankeyapplication-v$APP_VERSION.js.map|g" "$INDEX_FILE" || true
          rm "$f"
          echo "[INFO] Fichier original supprimé : $f"
        fi
      done

    # === CSS ===
    - |
      cd "$CSS_DIR"
      for f in main.*.css; do
        cp "$f" "sankeyapplication-v$APP_VERSION.css"
        echo "[INFO] CSS renommé : $f → sankeyapplication-v$APP_VERSION.css"
        sed -i "s|$f|sankeyapplication-v$APP_VERSION.css|g" "$INDEX_FILE"
        rm "$f"
        echo "[INFO] Fichier original supprimé : $f"
      done
      # Traitement des fichiers .css.map
      for f in main.*.css.map; do
        if [ -f "$f" ]; then
          cp "$f" "sankeyapplication-v$APP_VERSION.css.map"
          echo "[INFO] CSS.MAP renommé : $f → sankeyapplication-v$APP_VERSION.css.map"
          sed -i "s|$f|sankeyapplication-v$APP_VERSION.css.map|g" "$INDEX_FILE" || true
          rm "$f"
          echo "[INFO] Fichier original supprimé : $f"
        fi
      done


    # === Chemins relatifs pour GitLab Pages
    - sed -i 's|="/static/|="./static/|g' "$INDEX_FILE"

    # =================================================================
    # ÉTAPE 1 — Mirror des versions précédentes depuis Pages
    # On parse l'index.html actuel pour découvrir les versions deja
    # déployées, puis on miroir chacune dans public/<v>/.
    # Tolere les echecs partiels (Pages down, premier deploiement…).
    # =================================================================
    - echo "[INFO] Récupération de l'index Pages courant pour découvrir les versions"
    - |
      if wget --quiet --tries=2 --timeout=15 -O current_index.html "$PAGES_BASE_URL/index.html"; then
        echo "[INFO] index.html récupéré depuis $PAGES_BASE_URL"
        grep -oE 'href="\.?/?[0-9]+\.[0-9]+\.[0-9]+/"' current_index.html \
          | sed -E 's|href="\.?/?||; s|/"||' \
          | sort -u > previous_versions.txt || true
      else
        echo "[ATTENTION] Pas d'index.html accessible (premier déploiement ?) — historique vide"
        : > previous_versions.txt
      fi
    - echo "[INFO] Versions précédentes détectées :"
    - cat previous_versions.txt || true
    - |
      mirror_version() {
        local v="$1"
        local target="$PUBLIC_DIR/$v"
        echo "[INFO] Mirror $PAGES_BASE_URL/$v/ → $target"
        mkdir -p "$target"
        ( cd "$target" && wget \
            --recursive \
            --no-parent \
            --no-host-directories \
            --cut-dirs=2 \
            --reject "index.html.tmp*" \
            --quiet \
            --tries=2 \
            --timeout=30 \
            "$PAGES_BASE_URL/$v/" ) || echo "[ATTENTION] Mirror partiel ou échoué pour $v"
        if [ ! -f "$target/index.html" ]; then
          echo "[ATTENTION] $v sans index.html après mirror — supprimé"
          rm -rf "$target"
        fi
      }
    - |
      while IFS= read -r v; do
        [ -z "$v" ] && continue
        if [ "$v" = "$APP_VERSION" ]; then
          echo "[INFO] Skip $v (= version courante, reconstruite ci-dessous)"
          continue
        fi
        mirror_version "$v"
      done < previous_versions.txt

    # =================================================================
    # ÉTAPE 2 — Build courant → public/$APP_VERSION/ + public/latest/
    # =================================================================
    - mkdir -p "$VERSION_DIR"
    - cp -r "$BUILD_DIR"/* "$VERSION_DIR"
    - echo '<meta http-equiv="refresh" content="0; url=/" />' > "$VERSION_DIR/404.html"
    - echo "[INFO] Version $APP_VERSION copiée vers  $VERSION_DIR"

    # === Examples (viewer + editor + html-viewer) ===
    - mkdir -p "$VERSION_DIR/examples"
    - |
      for kind in viewer editor; do
        SRC="$CI_PROJECT_DIR/examples/current/$kind/build"
        DST="$VERSION_DIR/examples/$kind"
        if [ -d "$SRC" ]; then
          cp -r "$SRC" "$DST"
          echo "[INFO] Example $kind copié vers $DST"
        else
          echo "[ATTENTION] Example $kind absent: $SRC"
        fi
      done
    - |
      HTML_SRC="$CI_PROJECT_DIR/examples/current/html-viewer"
      HTML_DST="$VERSION_DIR/examples/html-viewer"
      if [ -d "$HTML_SRC" ]; then
        mkdir -p "$HTML_DST"
        cp "$HTML_SRC/index.html" "$HTML_DST/" 2>/dev/null || true
        cp "$HTML_SRC/example.json" "$HTML_DST/" 2>/dev/null || true
        cp "$HTML_SRC/example2colonnes.json" "$HTML_DST/" 2>/dev/null || true
        cp "$HTML_SRC/logo-socle.png" "$HTML_DST/" 2>/dev/null || true
        # Le bundle CDN pointe vers le main.<v>.js de la version courante
        cp "$VERSION_DIR/static/js/sankeyapplication-v$APP_VERSION.js" "$HTML_DST/bundle.js" 2>/dev/null || true
        cp "$VERSION_DIR/static/css/sankeyapplication-v$APP_VERSION.css" "$HTML_DST/bundle.css" 2>/dev/null || true
        echo "[INFO] html-viewer copié vers $HTML_DST"
      fi
    - cp "$CI_PROJECT_DIR/examples/index.html" "$VERSION_DIR/examples/index.html" 2>/dev/null || true

    # === Création du fichier static.zip ===
    - |
      if [ -d "$VERSION_DIR/static" ]; then
        cd "$VERSION_DIR"
        zip -rq "static.zip" static/
        echo "[INFO] Fichier static.zip créé pour la version $APP_VERSION"
      else
        echo "[ATTENTION] Le dossier static n'existe pas dans $VERSION_DIR"
      fi

    # === Copier aussi vers /latest ===
    - rm -rf "$LATEST_DIR"
    - cp -r "$VERSION_DIR" "$LATEST_DIR"
    - echo '<meta http-equiv="refresh" content="0; url=/" />' > "$LATEST_DIR/404.html"
    - echo "[INFO] Version latest mise à jour"

    # =================================================================
    # ÉTAPE 3 — Génération de public/index.html (toutes les versions)
    # =================================================================
    - |
      ls -1 "$PUBLIC_DIR" \
        | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
        | sort -u -V -r > all_versions.txt || true
      echo "[INFO] Versions à lister dans index.html :"
      cat all_versions.txt
    - |
      {
        echo '<!DOCTYPE html>'
        echo '<html lang="fr"><head><meta charset="utf-8">'
        echo '<title>SankeyApplication - Versions</title>'
        echo '<style>'
        echo 'body { font-family: Arial, sans-serif; margin: 40px; max-width: 800px; }'
        echo 'h1 { color: #333; }'
        echo 'h2 { color: #555; margin-top: 30px; }'
        echo 'a { display: block; margin: 8px 0; padding: 10px; background: #f5f5f5; text-decoration: none; color: #333; border-radius: 4px; }'
        echo 'a:hover { background: #e0e0e0; }'
        echo '.latest { background: #e8f4fd; font-weight: bold; }'
        echo '.latest:hover { background: #d1e7ff; }'
        echo '.download { font-size: 0.9em; color: #555; }'
        echo '.examples { font-size: 0.85em; color: #2b6cb0; margin-left: 1.5em; }'
        echo '</style></head><body>'
        echo '<h1>SankeyApplication — Versions disponibles</h1>'
        echo "<a class=\"latest\" href=\"./latest/\">Dernière version (latest = $APP_VERSION)</a>"
        echo '<h2>Toutes les versions</h2>'
        while IFS= read -r v; do
          [ -z "$v" ] && continue
          echo "<a href=\"./$v/\">Version $v</a>"
          if [ -d "$PUBLIC_DIR/$v/examples" ]; then
            echo "<a class=\"examples\" href=\"./$v/examples/\">examples ($v)</a>"
          fi
          if [ -f "$PUBLIC_DIR/$v/static.zip" ]; then
            echo "<a class=\"download\" href=\"./$v/static.zip\">static.zip (v$v)</a>"
          fi
        done < all_versions.txt
        echo '</body></html>'
      } > "$PUBLIC_DIR/index.html"

    - echo "[INFO] Déploiement terminé. Versions servies :"
    - ls -1 "$PUBLIC_DIR"
  artifacts:
    paths:
      - public
