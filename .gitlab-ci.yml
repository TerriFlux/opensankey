# Deploy : Only for main, on dev url acces
dev_opensankey:
  stage: deploy
  variables:
    NODE_ENV: "production"
    FOLDER: /home/ubuntu/dev_opensankey/sankeyapplication
    ENV: dev
    APP_NAME: dev_sankeyapp
    CLIENT_ROOT_URL: https://dev.open-sankey.fr/#/
    INTERNAL_HTTP_PORT: 56564
  only:
    - main
  tags:
    - dev
  environment:
    name: dev
  script:
    # DBG
    - echo $FOLDER
    # Clean and pull repo
    - git config --global --add safe.directory $FOLDER
    - cd $FOLDER
    - git reset --hard
    - git clean -fdx -e server/db.sqlite -e server/__pycache__ -e doc/__pycache__ -e __pycache__ # -e MFAData
    - git fetch
    - git pull
    - git config --global --add safe.directory $FOLDER/submodules/OpenSankey+
    - git config --global --add safe.directory $FOLDER/submodules/OpenSankey+/submodules/OpenSankey
    - git config --global --add safe.directory /home/ubuntu/dev_opensankey/sankeyapplication/submodules/OpenSankey+/submodules/OpenSankey/submodules/SankeyExcelParser
    - git submodule update --init --recursive
    - git submodule foreach --recursive git reset --hard
    - git submodule foreach --recursive git clean -fdx #-e server/db.sqlite -e server/__pycache__ -e doc/__pycache__ -e __pycache__
    - git submodule update --recursive
    # Build client & server
    - source /home/ubuntu/dev_opensankey/dev_opensankey/bin/activate
    - bash deploy_SankeyApp.sh
    # Update db
    - alembic upgrade head
    # Start app
    - echo 'http = 0.0.0.0:${INTERNAL_HTTP_PORT}' >> sankeyapp.ini
    - source env.sh --ci
    - bash restart_site.sh $ENV
    - sudo docker stop stripe_dev
    - sudo docker run --name stripe_dev --rm -d stripe/stripe-cli --api-key $STRIPE_SECRET_KEY listen --forward-to 0.0.0.0:${INTERNAL_HTTP_PORT}/stripe/webhook

