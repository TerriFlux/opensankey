      <h1>Visualize all your data on a single graph with OpenSankey</h1>

      OpenSankey lets you quickly and easily create flow charts or Sankey diagrams from your data.
      You must enable JavaScript to run this application.

      <h2>What are Sankey diagrams ?</h2>

      <a href=https://en.wikipedia.org/wiki/Sankey_diagram>Sankey diagrams</a> are specific data visualization techniques that use flows to help you visualize and understand your data.

      <h2>Usable in all fields</h2>

      Explain your business easily by showing your cash flow, supplies, energy, losses, etc. with Sankey diagrams.
      OpenSankey lets you draw the structure of your flows, add your data directly and customize the graphic rendering.
      What's more, OpenSankey lets you load data directly from Excel and SankeyMatic files, then modify them via the graphical interface.

      <h2>OpenSankey is free</h2>

      With OpenSankey, freely create flow charts from scratch or from one of the available starting templates.

      <h2>For even more functionality, purchase the OpenSankey+ license.</h2>

      Take your data to the next level and create real infographics and storytelling tools with the OpenSankey+ license at 65€/month.
