      <h1>Visualisez toutes vos données sur un seul graphe avec OpenSankey</h1>

      OpenSankey permet de créer simplement et rapidement des diagrammes de flux ou diagrammes de Sankey à partir de vos données.
      Vous devez activer JavaScript pour utiliser cette application.

      <h2>Qu'est-ce qu'un diagramme de Sankey ?</h2>

      <a href=https://fr.wikipedia.org/wiki/Diagramme_de_Sankey>Les diagrammes de Sankey </a> sont des techniques spécifiques de visualisation de données qui utilisent les flux pour vous aider à visualiser et comprendre vos données.

      <h2>Utilisables dans tous les domaines</h2>

      Expliquez facilement votre activité en montrant vos flux de trésorerie, vos approvisionnements, votre énergie, vos pertes, etc. grâce aux diagrammes de Sankey.
      OpenSankey vous permet de dessiner la structure de vos flux, d'y ajouter directement vos données et de personnaliser le rendu graphique.
      Pratique, OpenSankey vous permet de charger vos données directement à partir de fichiers Excel et SankeyMatic et de les modifier ensuite via l'interface graphique.

      <h2>OpenSankey est gratuit</h2>

      Avec OpenSankey, créez gratuitement n'importe quelle visualisation à partir de zéro ou d'un des modèles de départ disponibles.

      <h2>Pour plus de fonctionnalités, achetez la licence OpenSankey+.</h2>

      Passez au niveau supérieur et créez de véritables infographies pour raconter vos données grâce aux fonctionnalités additionnelles proposées avec OpenSankey+, à partir de 30 €/mois ou 300 €/an.
      <ul>
        <li>Ajoutez des icones ou utilisez ceux fournis pour illustrer vos noeuds</li>
        <li>Filtrez vos données et flux dynamiquement</li>
        <li>Comparez vos données sur le temps ou en fonction des secteurs géographiques</li>
        <li>Inserez des légendes textuelles pour apporter plus de contexte</li>
        <li>Créez et naviguez dans vos données grace au système de vues Sankey</li>
      </ul>

      <h2>A propos d'OpenSankey</h2>
