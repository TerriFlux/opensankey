stages:
    - build

# Pip's cache doesn't store the python packages
# https://pip.pypa.io/en/stable/reference/pip_install/#caching
#
# If you want to also cache the installed packages, you have to install
# them in a virtualenv and cache it as well.
cache:
  paths:
    - .cache/pip

# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

build:
  stage: build
  tags:
    - dev
  script:
    # Prepare env
    - echo $CI_PROJECT_DIR
    - source /home/gitlab-runner/gitlab_dev/bin/activate
    # Install and link open-sankey node module
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/su-model/opensankey.git
    - cd opensankey
    - bash build_client.sh -I -D
    - cd ..
    - export OPENSANKEY=`pwd`/opensankey/opensankey/client
    # Build OpenSankey+ node module
    - bash build_client.sh -I -L -B -D -K $OPENSANKEY
  except:
    - schedules