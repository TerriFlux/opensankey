<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Viewer OpenSankey — exemple React</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* Le viewer de @terriflux/opensankey@1.2.0 rend son conteneur #sankey_app sans hauteur :
         en mode `embedded`, la zone de dessin se cadre sur le clientHeight de ce div, qui
         s'effondre, et le diagramme se reduit pour tenir dans une bande. Corrige dans le paquet
         (ViewApp.tsx), mais la correction n'arrivera ici qu'a la prochaine version publiee — cette
         regle rend l'exemple correct entre-temps, et reste inoffensive apres. */
      #sankey_app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <noscript>Ce site a besoin de JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
